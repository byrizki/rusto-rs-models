name: Publish Models Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      tiers:
        description: 'Model tiers to publish (comma-separated: tiny,small,medium)'
        required: false
        default: 'tiny,small,medium'

jobs:
  publish:
    name: Download & Publish Models
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download PP-OCRv6 models from ModelScope
        run: |
          mkdir -p models

          TIERS="${{ github.event.inputs.tiers }}"
          IFS=',' read -ra TIER_LIST <<< "$TIERS"

          MODELSCOPE_BASE="https://www.modelscope.cn/api/v1/models/RapidAI/RapidOCR/repo?Revision=master&FilePath="

          for TIER in "${TIER_LIST[@]}"; do
            TIER=$(echo "$TIER" | tr -d ' ')
            echo "=== Downloading $TIER tier ==="

            curl -L -f -o "models/ppocrv6_det_${TIER}.mnn" \
              "${MODELSCOPE_BASE}mnn%2FPP-OCRv6%2Fdet%2FPP-OCRv6_det_${TIER}.mnn"
            echo "✓ det $TIER"

            curl -L -f -o "models/ppocrv6_rec_${TIER}.mnn" \
              "${MODELSCOPE_BASE}mnn%2FPP-OCRv6%2Frec%2FPP-OCRv6_rec_${TIER}.mnn"
            echo "✓ rec $TIER"
          done

          # Download dictionaries
          curl -L -f -o "models/ppocrv6_tiny_dict.txt" \
            "${MODELSCOPE_BASE}paddle%2FPP-OCRv6%2Frec%2FPP-OCRv6_rec_tiny%2Fppocrv6_tiny_dict.txt"
          echo "✓ dict tiny"

          curl -L -f -o "models/ppocrv6_dict.txt" \
            "${MODELSCOPE_BASE}paddle%2FPP-OCRv6%2Frec%2FPP-OCRv6_rec_small%2Fppocrv6_dict.txt"
          echo "✓ dict small/medium"

          echo ""
          echo "=== Downloaded files ==="
          ls -lh models/

      - name: Generate checksums
        run: |
          cd models
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: RustO! Models ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## RustO! OCR Models — ${{ github.event.inputs.version }}

            Pre-converted MNN model files for [rusto-rs](https://github.com/byrizki/rusto-rs).

            ### PP-OCRv6 Models

            | Tier | Det Model | Rec Model | Dict |
            |------|-----------|-----------|------|
            | **Tiny** (default) | `ppocrv6_det_tiny.mnn` ~1.7 MB | `ppocrv6_rec_tiny.mnn` ~4.3 MB | `ppocrv6_tiny_dict.txt` ~27 KB |
            | **Small** | `ppocrv6_det_small.mnn` ~9.4 MB | `ppocrv6_rec_small.mnn` ~21 MB | `ppocrv6_dict.txt` ~75 KB |
            | **Medium** | `ppocrv6_det_medium.mnn` ~60 MB | `ppocrv6_rec_medium.mnn` ~74 MB | `ppocrv6_dict.txt` ~75 KB |

            ### Quick Download (Tiny tier)
            ```bash
            bash <(curl -sSL https://raw.githubusercontent.com/byrizki/rusto-rs/main/scripts/download_models.sh)
            ```

            ### Model Sources
            - [ModelScope RapidAI/RapidOCR](https://www.modelscope.cn/models/RapidAI/RapidOCR)
            - [PaddleOCR](https://github.com/PaddlePaddle/PaddleOCR) (Apache 2.0)
          files: |
            models/*.mnn
            models/*.txt
            models/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
